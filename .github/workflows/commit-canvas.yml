name: Commit Canvas Daily Automation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Target author email (leave blank to automatically use secrets.GIT_USER_EMAIL)'
        required: false
        default: ''
      force:
        description: 'Force re-committing pattern (bypasses idempotency check)'
        type: boolean
        required: false
        default: false
      intensity:
        description: 'Intensity Level (1: 0-10 light, 2: 0-3 minimal, 3: 0-30 moderate, 4: 0-50 peak)'
        required: false
        default: '3'
      weeks:
        description: 'Number of weeks to process'
        required: false
        default: '1'
      start_date:
        description: 'Target start date (YYYY-MM-DD, e.g. 2026-03-01)'
        required: false
        default: ''
      end_date:
        description: 'Target end date (YYYY-MM-DD, e.g. 2026-06-30)'
        required: false
        default: ''
      exclude_dates:
        description: 'Comma-separated dates (MM-DD or YYYY-MM-DD) to exclude for peak preservation'
        required: false
        default: '03-23,03-27,04-27,05-11,05-27,05-28,06-10,06-14'

jobs:
  generate-contribution-pattern:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for verification

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Configure Git Credentials
        run: |
          USER_EMAIL="${{ inputs.user_email }}"
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="${{ secrets.GIT_USER_EMAIL }}"
          fi
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="Kyrell0602@gmail.com"
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "$USER_EMAIL"

      - name: "Execute Commit Canvas Engine (Pattern: all-but-sat)"
        run: |
          INTENSITY="${{ inputs.intensity }}"
          WEEKS="${{ inputs.weeks }}"
          START_DATE="${{ inputs.start_date }}"
          END_DATE="${{ inputs.end_date }}"
          EXCLUDE_DATES="${{ inputs.exclude_dates }}"
          USER_EMAIL="${{ inputs.user_email }}"
          FORCE="${{ inputs.force }}"
          # Fallback for schedule events (daily cron) where inputs are empty
          INTENSITY="${INTENSITY:-3}"
          WEEKS="${WEEKS:-1}"
          EXCLUDE_DATES="${EXCLUDE_DATES:-03-23,03-27,04-27,05-11,05-27,05-28,06-10,06-14}"
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="${{ secrets.GIT_USER_EMAIL }}"
          fi
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="Kyrell0602@gmail.com"
          fi
          EXTRA_ARGS=""
          if [ -n "$START_DATE" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --start-date=$START_DATE"
          fi
          if [ -n "$END_DATE" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --end-date=$END_DATE"
          fi
          if [ "$FORCE" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          npx ts-node src/cli.ts sync --pattern=all-but-sat --intensity=$INTENSITY --weeks=$WEEKS --exclude-dates="$EXCLUDE_DATES" --email="$USER_EMAIL" $EXTRA_ARGS

      - name: Verify Git History Rule Compliance
        id: verify
        continue-on-error: true
        run: |
          npx ts-node src/cli.ts verify --pattern=all-but-sat

      - name: Self-Healing Protocol (Triggered on Verify Failure)
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Verification failed! Initiating self-healing protocol..."
          npx ts-node src/cli.ts heal --branch=${{ github.ref_name }}
          echo "Healing complete. Re-verifying..."
          npx ts-node src/cli.ts verify --pattern=all-but-sat

      - name: Push Updated Contribution History
        run: |
          git push origin HEAD:${{ github.ref_name }} --force
