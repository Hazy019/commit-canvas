name: Commit Canvas Daily Automation

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      intensity:
        description: 'Intensity Level (1: 2-10, 2: 5-60, 3: 0-55 organic moderate, 4: 0-80 organic peak)'
        required: false
        default: '3'
      weeks:
        description: 'Number of weeks to process'
        required: false
        default: '1'
      start_date:
        description: 'Target start date (YYYY-MM-DD, e.g. 2026-01-01)'
        required: false
        default: ''
      exclude_dates:
        description: 'Comma-separated dates (MM-DD or YYYY-MM-DD) to exclude for peak preservation'
        required: false
        default: '05-11,05-27,05-28'

jobs:
  generate-contribution-pattern:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for verification

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Execute Commit Canvas Engine (Pattern: all-but-sat)"
        run: |
          INTENSITY="${{ inputs.intensity }}"
          WEEKS="${{ inputs.weeks }}"
          START_DATE="${{ inputs.start_date }}"
          EXCLUDE_DATES="${{ inputs.exclude_dates }}"
          USER_EMAIL="${{ inputs.user_email }}"
          # Fallback for schedule events where inputs are empty
          INTENSITY="${INTENSITY:-3}"
          WEEKS="${WEEKS:-1}"
          EXCLUDE_DATES="${EXCLUDE_DATES:-05-11,05-27,05-28}"
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="${{ secrets.GIT_USER_EMAIL }}"
          fi
          if [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="${{ github.actor }}@users.noreply.github.com"
          fi
          EXTRA_ARGS=""
          if [ -n "$START_DATE" ]; then
            EXTRA_ARGS="--start-date=$START_DATE"
          fi
          npx ts-node src/cli.ts sync --pattern=all-but-sat --intensity=$INTENSITY --weeks=$WEEKS --exclude-dates="$EXCLUDE_DATES" $EXTRA_ARGS --email="$USER_EMAIL"

      - name: Verify Git History Rule Compliance
        id: verify
        continue-on-error: true
        run: |
          npx ts-node src/cli.ts verify --pattern=all-but-sat

      - name: Self-Healing Protocol (Triggered on Verify Failure)
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Verification failed! Initiating self-healing protocol..."
          npx ts-node src/cli.ts heal --branch=${{ github.ref_name }}
          echo "Healing complete. Re-verifying..."
          npx ts-node src/cli.ts verify --pattern=all-but-sat

      - name: Push Updated Contribution History (with Force-With-Lease Fallback)
        run: |
          for i in 1 2 3; do
            git push --force-with-lease origin HEAD:${{ github.ref_name }} && break || {
              echo "Push failed. Retrying attempt $i of 3 in $(( $i * 3 ))s..."
              sleep $(( $i * 3 ))
              git fetch origin ${{ github.ref_name }}
            }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
